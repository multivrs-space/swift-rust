name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
      - uses: Swatinem/rust-cache@v2
      - name: Install JS deps
        run: bun install --frozen-lockfile
      - name: Build Rust workspace
        run: cargo build --workspace
      - name: Build JS workspace
        run: bun run build
      # Gate the publish on the quality of what actually ships. Private apps
      # (web, docs, ui-site) are checked in ci.yml, not here, so they can't
      # block a release.
      - name: Lint, typecheck & test (publishable packages)
        run: bunx turbo run lint typecheck test --filter='./packages/*'
      - name: Create or publish changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
